name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Create the app if it does not exist yet (ignore error if it does).
          flyctl apps create proof-gatekeeper-agent --org personal 2>/dev/null || true
          # Create the persistent volume for agent state if missing.
          flyctl volumes create gatekeeper_data --size 1 --region sin --app proof-gatekeeper-agent 2>/dev/null || true
          # Deploy (remote Docker build; the image includes the circuit artifacts).
          flyctl deploy --remote-only --app proof-gatekeeper-agent
